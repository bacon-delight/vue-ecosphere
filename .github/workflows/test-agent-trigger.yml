name: Test Agent

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master, develop]

permissions:
  pull-requests: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile && npm ci --prefix ./test-agent 2>/dev/null || true

      - name: Wait for Vercel preview
        run: sleep 10

      - name: Fetch preview URL from PR
        id: preview
        uses: actions/github-script@v7
        with:
          script: |
              const prNumber = context.issue.number;

              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber
              });

              const urlComment = comments.data.find(c =>
                c.body.includes('Preview deployed') || c.body.includes('Visit Preview')
              );

              if (!urlComment) {
                console.log('No preview comment found yet; will retry...');
                return;
              }

              const urlMatch = urlComment.body.match(/\[(?:view live|Visit Preview)\]\(([^)]+)\)/);
              const previewUrl = urlMatch?.[1];

              if (!previewUrl) {
                console.log('Could not extract URL from comment');
                return;
              }

              console.log(`Preview URL: ${previewUrl}`);
              core.setOutput('preview-url', previewUrl);
              core.setOutput('pr-number', prNumber);

      - name: Run test agent
        if: ${{ steps.preview.outputs.preview-url != '' }}
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          PR_NUMBER: ${{ steps.preview.outputs.pr-number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node test-agent/index.js \
            --url "$PREVIEW_URL" \
            --pr "$PR_NUMBER" \
            --owner "${{ github.repository_owner }}" \
            --repo "vue-ecosphere"
