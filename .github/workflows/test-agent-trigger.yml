name: Test Agent

on:
    workflow_run:
        workflows: ["Deploy Preview"]
        types: [completed]
        branches: [main, master, develop]

permissions:
    pull-requests: write
    issues: write

jobs:
    test:
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci && npm ci --prefix ./test-agent 2>/dev/null || npm ci

            - name: Fetch preview URL from PR
              id: preview
              uses: actions/github-script@v7
              with:
                  script: |
                      const run = await github.rest.actions.getWorkflowRun({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        run_id: context.payload.workflow_run.id
                      });

                      const prNumber = run.data.pull_requests[0]?.number;
                      if (!prNumber) {
                        console.log('No PR found; skipping test agent');
                        return;
                      }

                      const comments = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: prNumber
                      });

                      const urlComment = comments.data.find(c =>
                        c.body.includes('Preview deployed')
                      );

                      const urlMatch = urlComment?.body.match(/\[view live\]\(([^)]+)\)/);
                      const previewUrl = urlMatch?.[1];

                      if (!previewUrl) {
                        throw new Error('Could not extract preview URL from PR comments');
                      }

                      console.log(`Preview URL: ${previewUrl}`);
                      core.setOutput('preview-url', previewUrl);
                      core.setOutput('pr-number', prNumber);

            - name: Run test agent
              if: ${{ steps.preview.outputs.preview-url != '' }}
              env:
                  PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
                  PR_NUMBER: ${{ steps.preview.outputs.pr-number }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
              run: |
                  node test-agent/index.js \
                    --url "$PREVIEW_URL" \
                    --pr "$PR_NUMBER" \
                    --owner "${{ github.repository_owner }}" \
                    --repo "vue-ecosphere"
