name: Deploy Preview

on:
    pull_request:
        types: [opened, synchronize, reopened]
        branches: [main, master, develop]

env:
    NODE_VERSION: "20"

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9.12.3

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run lint & type check
              run: pnpm lint 2>&1 || true && pnpm type-check 2>&1 || true
              continue-on-error: true

            - name: Build library
              run: pnpm build:lib

            - name: Signal build complete
              run: echo "✅ Build complete — Vercel will deploy automatically via its GitHub integration"
