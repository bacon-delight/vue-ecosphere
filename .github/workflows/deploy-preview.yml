name: Deploy Preview

on:
    pull_request:
        types: [opened, synchronize, reopened]
        branches: [main, master, develop]

env:
    NODE_VERSION: "18"

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run lint & type check
              run: npm run lint 2>&1 || true && npm run type-check 2>&1 || true
              continue-on-error: true

            - name: Build library
              run: npm run build

            - name: Deploy to Vercel
              id: vercel
              uses: amondnet/vercel-action@v25
              with:
                  vercel-token: ${{ secrets.VERCEL_TOKEN }}
                  vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
                  vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
                  working-directory: ./
                  alias-domains: ${{ github.head_ref }}.ecosphere.dev

            - name: Post preview URL to PR
              uses: actions/github-script@v7
              with:
                  script: |
                      const previewUrl = '${{ steps.vercel.outputs.preview-url }}';
                      const botComment = `🚀 **Preview deployed** — [view live](${previewUrl})`;

                      const comments = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number
                      });

                      const existingComment = comments.data.find(c =>
                        c.user.type === 'Bot' && c.body.includes('Preview deployed')
                      );

                      if (existingComment) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: existingComment.id,
                          body: `${botComment}\n\n⏰ Updated: ${new Date().toISOString()}`
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body: botComment
                        });
                      }
