name: Deploy Preview

on:
    pull_request:
        types: [opened, synchronize, reopened]
        branches: [main, master, develop]

env:
    NODE_VERSION: "18"

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run lint & type check
              run: npm run lint 2>&1 || true && npm run type-check 2>&1 || true
              continue-on-error: true

            - name: Build library
              run: npm run build

            - name: Signal build complete
              run: echo "✅ Build complete — Vercel will deploy automatically via its GitHub integration"
